name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Dummy Assets if not present
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\Downloads"
          # Empty or minimal dummies if needed for compilation
          if (-not (Test-Path "$HOME\Downloads\TIKI TIKI.mp3")) {
            [IO.File]::WriteAllBytes("$HOME\Downloads\TIKI TIKI.mp3", (New-Object byte[] 1024))
          }
          if (-not (Test-Path "$HOME\Downloads\1394671.png")) {
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap 100, 100
            $bmp.Save("$HOME\Downloads\1394671.png", [System.Drawing.Imaging.ImageFormat]::Png)
          }
          foreach ($i in 1..3) {
            if (-not (Test-Path "$HOME\Downloads\$i.jpg")) {
              Add-Type -AssemblyName System.Drawing
              $bmp = New-Object System.Drawing.Bitmap 100, 100
              $bmp.Save("$HOME\Downloads\$i.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg)
            }
          }

      - name: Compile
        shell: cmd
        run: |
          call build.bat

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: AURA.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
