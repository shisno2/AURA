<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a12" />
      <stop offset="50%" stop-color="#140f28" />
      <stop offset="100%" stop-color="#0a0518" />
    </linearGradient>

    <!-- Aura Glow Gradient -->
    <radialGradient id="auraGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="236" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Radial Aura Glow -->
  <circle cx="425" cy="115" r="280" fill="url(#auraGlow)" />

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="500" y1="0" x2="500" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="0" y1="60" x2="850" y2="60" />
    <line x1="0" y1="120" x2="850" y2="120" />
    <line x1="0" y1="180" x2="850" y2="180" />
  </g>

  <!-- Sound Wave decorative bars on sides -->
  <g fill="#8b5cf6" opacity="0.3">
    <rect x="70" y="105" width="4" height="30" rx="2"/>
    <rect x="80" y="90" width="4" height="60" rx="2"/>
    <rect x="90" y="80" width="4" height="80" rx="2"/>
    <rect x="100" y="95" width="4" height="50" rx="2"/>
    <rect x="110" y="110" width="4" height="20" rx="2"/>

    <rect x="736" y="110" width="4" height="20" rx="2"/>
    <rect x="746" y="95" width="4" height="50" rx="2"/>
    <rect x="756" y="80" width="4" height="80" rx="2"/>
    <rect x="766" y="90" width="4" height="60" rx="2"/>
    <rect x="776" y="105" width="4" height="30" rx="2"/>
  </g>

  <!-- Main Title -->
  <text x="425" y="118"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="64"
        font-weight="900"
        letter-spacing="18"
        fill="url(#textGrad)"
        text-anchor="middle"
        filter="url(#glow)">
    A U R A
  </text>

  <!-- Subtitle -->
  <text x="425" y="162"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14"
        font-weight="600"
        letter-spacing="5"
        fill="#94a3b8"
        text-anchor="middle">
    INTERACTIVE DESKTOP VISUAL &amp; AUDIO EXPERIENCE
  </text>

  <!-- Status / Details Pill -->
  <g transform="translate(325, 185)">
    <rect width="200" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity="0.8" />
    <circle cx="15" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="11"
          font-weight="600"
          fill="#c7d2fe">
      STANDALONE C# • WIN32
    </text>
  </g>
</svg>
